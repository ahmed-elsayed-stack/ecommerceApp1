<div class=" p-3 rounded-lg shadow hover:shadow-lg transition duration-200">
  <div>

<img
  [src]="product.imageCover"
  class="product-img h-full rounded-md mb-3 object-cover cursor-pointer"

  alt=""
>

  <h3 class="text-main text-sm mb-1">
    {{ product.category.name | titlecase }}
  </h3>

  <h4 class="text-base font-medium mb-2 line-clamp-2">
    {{ product.title | termText : 3 }}
  </h4>

  <div class="flex justify-between items-center mb-3">

    <span class="font-semibold">
      {{ product.price | currency : 'GBP' }}
    </span>

    <div class="flex items-center gap-1">

    <app-rating-stars
    [rating]="product.ratingsAverage"
    ></app-rating-stars>

    </div>

  </div>
  </div>

  <ng-content></ng-content>

</div>
