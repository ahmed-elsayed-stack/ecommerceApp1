<section class="p-2 my-2">
  <h2 class="my-1 p-1 text-gray-600 font-bold ">All Products</h2>

  <div class="mb-5 w-full max-w-md mx-auto">
    <div class="flex items-center border border-primary/30 rounded-lg overflow-hidden transition-all duration-300 focus-within:border-primary focus-within:shadow-md">

      <!-- Input -->
      <input
        type="text"
        placeholder="Search for products..."
        [(ngModel)]="searchTerm"
        class="flex-1 px-4 py-2 text-gray-700 placeholder-gray-400 focus:outline-none "
      />

      <!-- Search Icon -->
      <span class="px-4 text-primary hover:text-primary-dark transition-transform duration-300 transform hover:scale-110">
        <i class="pi pi-search text-lg"></i>
      </span>

    </div>
  </div>

  <!-- Empty State -->
  @if ((productList() | searchProduct : searchTerm).length === 0) {
    <div class="flex flex-col items-center justify-center py-12 text-center animate-fade-in">

      <div class="bg-primary/10 text-primary rounded-full p-5 mb-4 shadow-sm">
        <i class="pi pi-search text-4xl"></i>
      </div>

      <h3 class="text-xl font-semibold text-gray-700 mb-1">
        No products found
      </h3>

      <p class="text-gray-500 mb-4">
        Try searching with a different keyword
      </p>

      <p-button
        pButton
        type="button"
        label="Clear Search"
        icon="pi pi-times"
        class="p-button-outlined"
        (click)="searchTerm = ''"
      ></p-button>

    </div>
  }

  <!-- Products Grid -->
  @if ((productList() | searchProduct : searchTerm).length > 0) {
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2">

      <ng-container>
        @for (item of productList() | searchProduct : searchTerm; track item.id) {
          <app-product-card
            [product]="item"
            [routerLink]="['/detailsProduct' , item.id]"
          >
            <app-add-to-cart-button [productId]="item._id"></app-add-to-cart-button>
          </app-product-card>
        }
      </ng-container>

    </div>
  }

</section>
