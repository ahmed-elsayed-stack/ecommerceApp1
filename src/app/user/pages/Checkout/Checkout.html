<section class="max-w-2xl mx-auto p-4">

  <h2 class="text-2xl font-bold text-gray-700 mb-6">
    Checkout
  </h2>

  <form [formGroup]="checkoutForm" (ngSubmit)="submit()" class="space-y-5">

    <!-- Details -->
    <div class="field">
      <label class="block mb-2 text-gray-600">Details</label>

      <p-inputGroup>
        <p-inputGroupAddon>
          <i class="pi pi-map-marker"></i>
        </p-inputGroupAddon>

        <input
          type="text"
          pInputText
          formControlName="details"
          placeholder="Enter your address details"
          class="w-full"
        />
      </p-inputGroup>
    </div>

    <!-- Phone -->
    <div class="field">
      <label class="block mb-2 text-gray-600">Phone</label>

      <p-inputGroup>
        <p-inputGroupAddon>
          <i class="pi pi-phone"></i>
        </p-inputGroupAddon>

        <input
          type="text"
          pInputText
          formControlName="phone"
          placeholder="Enter phone number"
          class="w-full"
        />
      </p-inputGroup>
    </div>

    <!-- City -->
    <div class="field">
      <label class="block mb-2 text-gray-600">City</label>

      <p-inputGroup>
        <p-inputGroupAddon>
          <i class="pi pi-building"></i>
        </p-inputGroupAddon>

        <input
          type="text"
          pInputText
          formControlName="city"
          placeholder="Enter city"
          class="w-full"
        />
      </p-inputGroup>
    </div>

    <!-- Submit -->
    <p-button
      pButton
      type="submit"
      label="Pay Now"
      icon="pi pi-credit-card"
      class="p-button-success w-full mt-4"
      [disabled]="checkoutForm.invalid"
    ></p-button>

  </form>

</section>
