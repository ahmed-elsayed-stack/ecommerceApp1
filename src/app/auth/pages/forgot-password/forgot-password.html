<app-auth-form
  title="Forgot Password"
  [formGroup]="ForgotPassForm"
  submitLabel="continue"
  [loading]="isLoading"
  (formSubmit)="ForgotPassSubmit()"
>

  <!-- Email -->
  <div class="my-4 field">

    <p-inputgroup>
      <p-inputgroup-addon>
        <i class="pi pi-envelope"></i>
      </p-inputgroup-addon>

      <input
        type="email"
        formControlName="email"
        pInputText
        placeholder="Enter your email"
        class="w-full"
        [pAutoFocus]="true"
      />
    </p-inputgroup>

    <app-error-message
      [control]="ForgotPassForm.get('email')"
      type="email">
    </app-error-message>

  </div>

  <!-- Info Text -->
  <p class="text-sm text-gray-500 text-right mt-2">
    We will send a reset link to your email
  </p>

</app-auth-form>

<!-- Auth Link -->
<div class="text-center mt-4">
  <app-auth-link
    text="Don't have an account?"
    linkText="Creat one now"
    link="/register">
  </app-auth-link>
</div>
