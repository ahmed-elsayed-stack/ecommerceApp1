<app-auth-form
  title="Reset Password"
  [formGroup]="resetPassForm"
  submitLabel="Reset Password"
  [loading]="isLoading"
  (formSubmit)="resetPasswordSubmit()"
>

  <!-- Email -->
  <div class="my-4 field">

    <p-inputgroup>
      <p-inputgroup-addon>
        <i class="pi pi-envelope"></i>
      </p-inputgroup-addon>

      <input
        type="email"
        formControlName="email"
        pInputText
        placeholder="Enter your email"
        class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
        [pAutoFocus]="true"
      />
    </p-inputgroup>

    <app-error-message
      [control]="resetPassForm.get('email')"
      type="email">
    </app-error-message>

  </div>

  <!-- New Password -->
  <div class="my-4 p-3 field">
    <p-inputgroup>
      <p-inputgroup-addon>
        <i class="pi pi-lock"></i>
      </p-inputgroup-addon>
      <input
        type="password"
        formControlName="newPassword"
        pInputText
         class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
      
        placeholder="newPassword"
      />
    </p-inputgroup>

    <app-error-message
      [control]="resetPassForm.get('newPassword')"
      type="password">
    </app-error-message>
  </div>

</app-auth-form>
